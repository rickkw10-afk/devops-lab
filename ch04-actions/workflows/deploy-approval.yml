# environment 로 배포 전에 사람 승인을 받는다.
# Settings > Environments > production 에서 Required reviewers 를 지정해 둬야 멈춘다.
name: deploy-approval

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "배포할 image tag (git sha 7자리)"
        required: true
        type: string

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - run: echo "deploy ${{ inputs.tag }} to staging"

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://example.com
    steps:
      - run: echo "deploy ${{ inputs.tag }} to production (DEPLOY_HOST=${{ vars.DEPLOY_HOST }})"
      - run: echo "token length ${#TOKEN}"
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}

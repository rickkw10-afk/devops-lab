# workflow 전체 구조를 한 파일에 모아 본 예. 각 키의 뜻은 슬라이드 "Workflow 문법 해부" 참고.
name: ci-cd
run-name: CI by ${{ github.actor }}   # 실행 목록에 보이는 이름

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "21"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "test on Java ${{ env.JAVA_VERSION }}"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: echo "build"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "deploy"

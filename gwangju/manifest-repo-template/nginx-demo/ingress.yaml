apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-demo
spec:
  ingressClassName: nginx
  rules:
    - host: skala-gj<N>-<ID>-nginx.skala-gj.com   # 반 namespace + 개인 ID. 클러스터에서 하나뿐이어야 한다
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-demo
                port:
                  number: 80

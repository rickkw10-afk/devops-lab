# 6장 연습용: 공개 image(nginx-unprivileged, 8080 포트)로 GitOps 흐름만 익힌다.
# 7장에서 우리 앱 image(harbor.skala-gj.com/skala-gj<N>/<ID>-devops-lab-app)로 바꾼다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-lab-app
  labels:
    app: devops-lab-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-lab-app
  template:
    metadata:
      labels:
        app: devops-lab-app
    spec:
      containers:
        - name: app
          image: nginxinc/nginx-unprivileged   # tag 는 kustomization.yaml 의 images 가 붙인다
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

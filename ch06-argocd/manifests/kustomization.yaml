apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: devops-lab                 # 모든 리소스에 namespace 를 붙인다
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
images:
  - name: nginxinc/nginx-unprivileged  # deployment.yaml 에 적힌 이름
    newTag: 1.27-alpine               # CI 는 이 줄만 고친다. 1.28-alpine 으로 바꾸고 commit 해 본다
